<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ArtiByte Executive Protocol</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#141a2b;--mute:#6a7388;--line:#d9deea;--accent:#2d4bd6;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1220;--surface:#171d31;--ink:#e8ecf8;--mute:#8d97b3;--line:#283050;--accent:#8fa6ff;--on:#0e1220;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1220;--surface:#171d31;--ink:#e8ecf8;--mute:#8d97b3;--line:#283050;--accent:#8fa6ff;--on:#0e1220;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
.home{height:100%;display:grid;place-items:center}
.orb{width:min(72vw,320px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:var(--on);
font:600 clamp(16px,4.6vw,22px)/1.3 inherit;font-family:inherit;padding:12%;display:grid;place-items:center;text-align:center;
box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 16%,transparent),0 0 0 32px color-mix(in srgb,var(--accent) 7%,transparent);
transition:transform .18s ease,box-shadow .18s ease}
.orb:hover{transform:scale(1.03)}
.orb:active{transform:scale(.96)}
.orb:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
.files{display:none;max-width:720px;margin:0 auto;padding:20px 16px 40px}
body.open .home{display:none}
body.open .files{display:block}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar h1{font-size:18px;margin:0;flex:1}
button.sm{font:600 13px inherit;font-family:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer}
button.sm.p{background:var(--accent);color:var(--on);border-color:transparent}
button.sm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--mute);font-size:13px;margin-bottom:16px}
.drop.on{border-color:var(--accent);color:var(--ink)}
.f{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.f h2{font-size:15px;margin:0 0 2px;word-break:break-all}
.meta{color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vers{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.v{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.v b{min-width:34px}
.v span{flex:1;color:var(--mute)}
.v a{color:var(--accent);cursor:pointer;font-weight:600;background:none;border:0;font:inherit;font-weight:600;padding:2px 4px}
.cur{color:var(--accent);font-size:11px;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border-radius:10px;padding:12px;max-height:50vh;overflow:auto;margin:10px 0 0}
.note{color:var(--mute);font-size:12px;margin-top:18px;line-height:1.5}
input[type=file]{display:none}
</style>
</head>
<body>
<main class="home">
  <button class="orb" id="go" aria-label="Open the ArtiByte Executive Protocol">Open the ArtiByte Executive Protocol</button>
</main>

<section class="files" id="files" aria-label="Files and versioning">
  <div class="bar">
    <button class="sm" id="back" aria-label="Back">Back</button>
    <h1>ArtiByte Executive Protocol</h1>
    <button class="sm p" id="add">Add files</button>
  </div>
  <div class="drop" id="drop">Drop files here. Each file with the same name becomes a new version.</div>
  <div id="list"></div>
  <p class="note">Storage status: saved in this browser only. Not synced anywhere else. Download a version to keep a copy elsewhere.</p>
  <input type="file" id="pick" multiple>
</section>

<script>
const KEY="artibyte-protocol-files-v1";
const SLOTS=["system-prompt.md","protocol-v2.8.1.md","config-ISSUE.md","operating-record-ISSUE.md"];
let db={};
try{db=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){db={}}
SLOTS.forEach(n=>{if(!db[n])db[n]=[]});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Browser storage is full or blocked. Download your versions to keep them.")}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>new Date(t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
const kb=n=>n<1024?n+" B":(n/1024).toFixed(1)+" KB";
let viewing=null;

function render(){
  $("list").innerHTML=Object.keys(db).map(name=>{
    const vs=db[name];
    const last=vs[vs.length-1];
    const head=last?`v${last.v} · ${fmt(last.t)} · ${kb(last.size)}`:"No file yet. Add the first version.";
    const hist=vs.slice().reverse().map(x=>`
      <div class="v"><b>v${x.v}</b><span>${fmt(x.t)} · ${kb(x.size)}</span>
      ${x===last?'<em class="cur">current</em>':''}
      <a data-act="view" data-n="${esc(name)}" data-v="${x.v}">View</a>
      <a data-act="dl" data-n="${esc(name)}" data-v="${x.v}">Download</a></div>
      ${viewing===name+"@"+x.v?`<pre>${esc(x.text)}</pre>`:""}`).join("");
    return `<div class="f"><h2>${esc(name)}</h2><div class="meta">${head}</div>
      <div class="row"><button class="sm p" data-act="up" data-n="${esc(name)}">${last?"Upload new version":"Upload file"}</button></div>
      ${vs.length?`<div class="vers">${hist}</div>`:""}</div>`;
  }).join("");
}

function ingest(file,forceName){
  return file.text().then(text=>{
    const name=forceName||file.name;
    if(!db[name])db[name]=[];
    const vs=db[name];
    vs.push({v:(vs.length?vs[vs.length-1].v:0)+1,t:Date.now(),size:file.size,text});
  });
}
function ingestAll(files,forceName){
  Promise.all([...files].map(f=>ingest(f,forceName))).then(()=>{save();render()});
}

let target=null;
$("go").onclick=()=>{document.body.classList.add("open");render();window.scrollTo(0,0)};
$("back").onclick=()=>document.body.classList.remove("open");
$("add").onclick=()=>{target=null;$("pick").click()};
$("pick").onchange=e=>{ingestAll(e.target.files,target);e.target.value=""};
$("list").onclick=e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  const n=a.dataset.n,act=a.dataset.act;
  if(act==="up"){target=n;$("pick").click()}
  if(act==="view"){const k=n+"@"+a.dataset.v;viewing=viewing===k?null:k;render()}
  if(act==="dl"){
    const x=db[n].find(y=>y.v==a.dataset.v);
    const b=new Blob([x.text],{type:"text/plain"});
    const l=document.createElement("a");
    const dot=n.lastIndexOf(".");
    l.href=URL.createObjectURL(b);
    l.download=(dot>0?n.slice(0,dot):n)+"-v"+x.v+(dot>0?n.slice(dot):"");
    l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1000);
  }
};
const d=$("drop");
["dragover","dragenter"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("on")}));
["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("on")}));
d.addEventListener("drop",e=>ingestAll(e.dataTransfer.files,null));
</script>
</body>
</html>
